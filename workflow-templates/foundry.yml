# Checks formatting, builds and tests Solidity contracts with Foundry.
# Actions are pinned to full commit SHAs; Dependabot can keep them current.
name: Contracts

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundry:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      # If dependencies are not committed or vendored as submodules, install them here, e.g.
      # forge install --no-git --shallow foundry-rs/forge-std@v1.9.4

      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
